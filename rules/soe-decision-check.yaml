# 三重一大决策台账核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库的诚实说明（2026-10-07 修订）：
#   **excerpt 现已引用中办发〔2010〕17号的逐字原文**（核查报告见 rules/evidence/）。
#   ⚠️ 但**该文件是党内文件，不是法律、行政法规或部门规章**，也不属于国家标准体系；
#   因此**每条规则仍为 kind: derived-from-principle（封顶 warn）** ——
#   **文字已核实，与"该文件能否为 error 级提供依据"是两件事**。
#   ⚠️ 该文件按（一）至（二十三）编号，**不设"第X条"**；引用一律用其自身的编号形式。
#   本插件核对的是"三重一大决策事项台账"的**程序留痕**：
#     议题内容与决策依据是否填写、前置研究是否记录且早于会议审议、
#     决议结论是否记录、表决结果是否填写、承办部门是否明确、
#     序号是否唯一、是否残留模板占位符。
#   其规范载体是**《关于进一步推进国有企业贯彻落实"三重一大"决策制度的意见》
#   （中办发〔2010〕17号）**与各企业的"三重一大"决策制度实施办法。
#   其**逐字原文已于 2026-10-07 取得并核对**（二十三项）；各企业实施办法仍未取得。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件绝不判定决策是否合规、
#   是否越权、金额是否达到"大额度资金运作"标准、是否应当追责**。
#   → **"三重一大"的具体标准（哪些事项、多大金额）由各企业实施办法规定**，
#     行业、层级、企业规模不同则标准不同，本插件**不硬编码任何金额阈值或事项清单**。
#   → 因此本插件只核对**台账自身的齐备与时间自洽**：
#     议题内容与依据是否填写、前置研究是否记录且早于会议日期、
#     决议与表决是否记录、承办部门是否明确、是否残留占位符。
#   → **前置研究要求（prerequisiteValues）与事项类别清单（categories）都出厂为空**。

plugin: dsh-soe-decision-check
version: "2026.1"

rules:
  - id: SD-001
    title: 每个议题都应填写议题内容与决策依据
    severity: warn
    basis:
      document: 《关于进一步推进国有企业贯彻落实"三重一大"决策制度的意见》
      number: 中办发〔2010〕17号（中共中央办公厅、国务院办公厅印发；⚠️ 党内文件，非法律、行政法规或部门规章；全文分三部分，按（一）至（二十三）编号，不设"第X条"）
      clause: （二）（集体决策原则与议事规则）与（十一）（会议决定的事项、过程、参与人及其意见、结论应当完整详细记录）
      excerpt: “三重一大”事项坚持集体决策原则。国有企业应当健全议事规则，明确“三重一大”事项的决策规则和程序，完善群众参与、专家咨询和集体决策相结合的决策机制。国有企业党委（党组）、董事会、未设董事会的经理班子等决策机构要依据各自的职责、权限和议事规则，集体讨论决定“三重一大”事项，防止个人或少数人专断。……会议决定的事项、过程、参与人及其意见、结论等内容，应当完整、详细记录并存档备查。
      kind: derived-from-principle
      source: https://gzw.gd.gov.cn/zcfg/content/post_1334456.html
    params:
        check:
          kind: presenceAny
          fields: ["proposal","basis"]
          fix: 补填议题内容与决策依据；本条只核对是否填写，不判断决策程序与权限是否适当
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-soe-triple-major.md）。
      ⚠️ **依据性质说明（2026-10-07）**：本意见是**中共中央办公厅、国务院办公厅印发的党内文件**，
      **不是法律、行政法规或部门规章**，也不属于国家标准体系。
      ⇒ **即使条号与文字已核实，本条仍保持 derived-from-principle（封顶 warn）**：
      **文字已核实，与"该文件能否为 error 级提供依据"是两件事。**
      ⚠️ 本条核对"议题内容与决策依据是否填写"：**（十一）逐字要求记录"会议决定的事项、过程、参与人及其意见、结论"**，**但未明文要求台账单设"决策依据"栏**——该栏的必要性来自可核对性。
      议题内容与决策依据是决策留痕的**最低要素**：缺其一，
      事后无法说明当时提请审议的是什么、依据什么提出。
      本次未取得明文条号，故封顶 warn。
      本条只核对"至少填了一个"，**不判断该事项是否属于"三重一大"范围，也不判断决策程序与权限是否适当**。

  - id: SD-002
    title: 经前置研究的议题应记录研究情况
    severity: warn
    basis:
      document: 《关于进一步推进国有企业贯彻落实"三重一大"决策制度的意见》
      number: 中办发〔2010〕17号（中共中央办公厅、国务院办公厅印发；⚠️ 党内文件，非法律、行政法规或部门规章；全文分三部分，按（一）至（二十三）编号，不设"第X条"）
      clause: （七）（提交会议集体决策前应当认真调查研究、经过必要的研究论证程序、充分吸收各方面意见）
      excerpt: “三重一大”事项提交会议集体决策前应当认真调查研究，经过必要的研究论证程序，充分吸收各方面意见。重大投资和工程建设项目，应当事先充分听取有关专家的意见。
      kind: derived-from-principle
      source: https://gzw.gd.gov.cn/zcfg/content/post_1334456.html
    params:
        check:
          kind: conditionalPresence
          conditionField: consulted
          requiredFields: ["consultedAt"]
          conditionValues: ["是","Y","yes","true","已研究","√"]
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-soe-triple-major.md）。
      ⚠️ **依据性质说明（2026-10-07）**：本意见是**中共中央办公厅、国务院办公厅印发的党内文件**，
      **不是法律、行政法规或部门规章**，也不属于国家标准体系。
      ⇒ **即使条号与文字已核实，本条仍保持 derived-from-principle（封顶 warn）**：
      **文字已核实，与"该文件能否为 error 级提供依据"是两件事。**
      ⚠️ **（七）逐字要求"提交会议集体决策前应当认真调查研究，经过必要的研究论证程序"**，**但未规定台账必须记录研究情况**——那是该程序要求的留痕前提。
      党委（党组）前置研究是"三重一大"决策程序的**关键环节**：
      台账若标了"已经前置研究"却不记录研究日期，程序留痕就断了。
      本次未取得明文条号，故封顶 warn。
      ⚠️ **哪些事项必须经前置研究由本企业实施办法规定**，因此本条读取的是台账自己的「是否经前置研究」栏，
      判定取值由 conditionValues 配置。
      本条只核对日期栏是否填写，**不判断前置研究是否实质开展、结论是否被采纳**。

  - id: SD-003
    title: 前置研究日期不应晚于会议审议日期
    severity: warn
    basis:
      document: 《关于进一步推进国有企业贯彻落实"三重一大"决策制度的意见》
      number: 中办发〔2010〕17号（中共中央办公厅、国务院办公厅印发；⚠️ 党内文件，非法律、行政法规或部门规章；全文分三部分，按（一）至（二十三）编号，不设"第X条"）
      clause: （七）（前置研究）与（九）（应当以会议的形式作出集体决策）
      excerpt: “三重一大”事项提交会议集体决策前应当认真调查研究，经过必要的研究论证程序，充分吸收各方面意见。重大投资和工程建设项目，应当事先充分听取有关专家的意见。党委（党组）、董事会、未设董事会的经理班子应当以会议的形式，对职责权限内的“三重一大”事项作出集体决策。不得以个别征求意见等方式作出决策。
      kind: derived-from-principle
      source: https://gzw.gd.gov.cn/zcfg/content/post_1334456.html
    params:
        check:
          kind: date
          field: consultedAt
          notAfterField: meetingAt
          fix: 前置研究日期不应晚于会议审议日期；核对两个日期的填写
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-soe-triple-major.md）。
      ⚠️ **依据性质说明（2026-10-07）**：本意见是**中共中央办公厅、国务院办公厅印发的党内文件**，
      **不是法律、行政法规或部门规章**，也不属于国家标准体系。
      ⇒ **即使条号与文字已核实，本条仍保持 derived-from-principle（封顶 warn）**：
      **文字已核实，与"该文件能否为 error 级提供依据"是两件事。**
      ⚠️ **（七）要求研究在"提交会议集体决策前"、（九）要求以会议形式决策** ⇒ 两个日期的先后由此可推；**但本意见未就日期自洽单设条文**。
      "先研究、后决策"是前置程序的**时间前提**；日期可解析是台账能被程序处理的前提。
      本次未取得明文条号，故封顶 warn。
      本条只比较两个日期（同一天视为不晚于），**不判断该程序是否实质履行、是否走过场**。
      日期无法解析时会单独报出，**不会静默跳过**。

  - id: SD-004
    title: 应记录决议结论
    severity: warn
    basis:
      document: 《关于进一步推进国有企业贯彻落实"三重一大"决策制度的意见》
      number: 中办发〔2010〕17号（中共中央办公厅、国务院办公厅印发；⚠️ 党内文件，非法律、行政法规或部门规章；全文分三部分，按（一）至（二十三）编号，不设"第X条"）
      clause: （十一）（会议决定的事项、过程、参与人及其意见、结论等内容，应当完整、详细记录并存档备查）
      excerpt: 会议决定的事项、过程、参与人及其意见、结论等内容，应当完整、详细记录并存档备查。
      kind: derived-from-principle
      source: https://gzw.gd.gov.cn/zcfg/content/post_1334456.html
    params:
        check:
          kind: presence
          field: decision
          fix: 补填决议结论；本条只核对是否记录，不判断决议是否合规
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-soe-triple-major.md）。
      ⚠️ **依据性质说明（2026-10-07）**：本意见是**中共中央办公厅、国务院办公厅印发的党内文件**，
      **不是法律、行政法规或部门规章**，也不属于国家标准体系。
      ⇒ **即使条号与文字已核实，本条仍保持 derived-from-principle（封顶 warn）**：
      **文字已核实，与"该文件能否为 error 级提供依据"是两件事。**
      ✅ **（十一）逐字要求记录"结论"**——这是本插件所引文件中对"决议结论"最直接的一句。
      决议结论是决策台账的**核心留痕**：没有它，会议开过与没开过在台账上无法区分。
      本次未取得明文条号，故封顶 warn。
      本条只核对结论栏是否填写，**不判断决议内容是否合规、是否越权**。

  - id: SD-005
    title: 应记录表决结果
    severity: warn
    basis:
      document: 《关于进一步推进国有企业贯彻落实"三重一大"决策制度的意见》
      number: 中办发〔2010〕17号（中共中央办公厅、国务院办公厅印发；⚠️ 党内文件，非法律、行政法规或部门规章；全文分三部分，按（一）至（二十三）编号，不设"第X条"）
      clause: （十）（与会人员要充分讨论并分别发表意见）与（十一）（参与人及其意见……应当完整、详细记录）
      excerpt: 决策会议符合规定人数方可召开。与会人员要充分讨论并分别发表意见，主要负责人应当最后发表结论性意见。会议决定多个事项时，应逐项研究决定。若存在严重分歧，一般应当推迟作出决定。会议决定的事项、过程、参与人及其意见、结论等内容，应当完整、详细记录并存档备查。
      kind: derived-from-principle
      source: https://gzw.gd.gov.cn/zcfg/content/post_1334456.html
    params:
        check:
          kind: conditionalPresence
          conditionField: decision
          requiredFields: ["voteResult"]
          conditionValues: []
          fix: 补填表决结果；本条只核对是否记录，不判断表决是否有效
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-soe-triple-major.md）。
      ⚠️ **依据性质说明（2026-10-07）**：本意见是**中共中央办公厅、国务院办公厅印发的党内文件**，
      **不是法律、行政法规或部门规章**，也不属于国家标准体系。
      ⇒ **即使条号与文字已核实，本条仍保持 derived-from-principle（封顶 warn）**：
      **文字已核实，与"该文件能否为 error 级提供依据"是两件事。**
      ⚠️ **（十）要求"分别发表意见"、（十一）要求记录"参与人及其意见"** ⇒ 表决／意见留痕有此依据；**但本意见未使用"表决结果"这一表述，也未规定票数记录方式**。
      集体决策要求**记录表决情况**：只写"同意"而不记票数，
      事后无法判断决议是否达到规定的通过比例。本次未取得明文条号，故封顶 warn。
      本条**只在决议结论栏已填写时**要求表决结果栏。
      ⚠️ **通过比例的要求由本企业实施办法规定**，本插件**不硬编码任何比例**，
      也**不核对票数是否达到比例**——那需要知道应到人数与表决规则，台账里通常不全。

  - id: SD-006
    title: 议题类别应使用本机构口径的取值
    severity: info
    basis:
      document: 《关于进一步推进国有企业贯彻落实"三重一大"决策制度的意见》
      number: 中办发〔2010〕17号（中共中央办公厅、国务院办公厅印发；⚠️ 党内文件，非法律、行政法规或部门规章；全文分三部分，按（一）至（二十三）编号，不设"第X条"）
      clause: （三）至（六）——"三重一大"四类事项的范围（其中（六）明确"大额度"的限额由企业或出资人机构规定）
      excerpt: 重大决策事项，是指依照《中华人民共和国公司法》……以及其他有关法律法规和党内法规规定的应当由股东大会（股东会）、董事会、未设董事会的经理班子、职工代表大会和党委（党组）决定的事项。……大额度资金运作事项，是指超过由企业或者履行国有资产出资人职责的机构所规定的企业领导人员有权调动、使用的资金限额的资金调动和使用。
      kind: derived-from-principle
      source: https://gzw.gd.gov.cn/zcfg/content/post_1334456.html
    params:
        check:
          kind: enum
          field: category
          values: []
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-soe-triple-major.md）。
      ⚠️ **依据性质说明（2026-10-07）**：本意见是**中共中央办公厅、国务院办公厅印发的党内文件**，
      **不是法律、行政法规或部门规章**，也不属于国家标准体系。
      ⇒ **即使条号与文字已核实，本条仍保持 derived-from-principle（封顶 warn）**：
      **文字已核实，与"该文件能否为 error 级提供依据"是两件事。**
      ⚠️ **（三）至（六）界定四类事项的范围**，**而（六）明确"大额度"的限额"由企业或者履行国有资产出资人职责的机构所规定"** ⇒ **具体阈值属本机构口径，本条 values 出厂为空即进 skipped**。
      values 出厂为空，表示**未配置**，本条进 skipped。
      依据说明："三重一大"指重大决策、重要人事任免、重大项目安排与大额度资金运作，
      但**各企业实施办法对具体事项与金额标准的界定不同**，本插件**不硬编码任何事项清单或金额阈值**。
      配置示例（某企业口径）：values: [重大决策, 重要人事任免, 重大项目安排, 大额度资金运作]。
      本条只核对所填值是否在册，**不判断该事项是否属于"三重一大"范围**。

  - id: SD-007
    title: 台账应声明企业与决策机构
    severity: warn
    basis:
      document: 《关于进一步推进国有企业贯彻落实"三重一大"决策制度的意见》
      number: 中办发〔2010〕17号（中共中央办公厅、国务院办公厅印发；⚠️ 党内文件，非法律、行政法规或部门规章；全文分三部分，按（一）至（二十三）编号，不设"第X条"）
      clause: （二）（决策机构：党委（党组）、董事会、未设董事会的经理班子）与（九）（以会议形式作出集体决策）
      excerpt: “三重一大”事项坚持集体决策原则。国有企业应当健全议事规则，明确“三重一大”事项的决策规则和程序，完善群众参与、专家咨询和集体决策相结合的决策机制。国有企业党委（党组）、董事会、未设董事会的经理班子等决策机构要依据各自的职责、权限和议事规则，集体讨论决定“三重一大”事项，防止个人或少数人专断。党委（党组）、董事会、未设董事会的经理班子应当以会议的形式，对职责权限内的“三重一大”事项作出集体决策。不得以个别征求意见等方式作出决策。
      kind: derived-from-principle
      source: https://gzw.gd.gov.cn/zcfg/content/post_1334456.html
    params:
        check:
          kind: headerPresence
          fields: ["company","body"]
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-soe-triple-major.md）。
      ⚠️ **依据性质说明（2026-10-07）**：本意见是**中共中央办公厅、国务院办公厅印发的党内文件**，
      **不是法律、行政法规或部门规章**，也不属于国家标准体系。
      ⇒ **即使条号与文字已核实，本条仍保持 derived-from-principle（封顶 warn）**：
      **文字已核实，与"该文件能否为 error 级提供依据"是两件事。**
      ⚠️ **（二）列举决策机构、（九）要求以会议形式决策**，**但未要求任何台账声明企业与决策机构**——那是结论可追溯性的前提。
      台账若不写明企业与决策机构，事项无法追溯到具体的决策主体与会议。
      本次未取得明文条号，故封顶 warn。
      配置项 company 对应企业名称，body 对应决策机构（党委会、董事会、总经理办公会等）。
      若本机构表式还在表头记录会议届次，把 meetingNo 加进 fields 即可。

  - id: SD-008
    title: 议题序号不应在台账内重复
    severity: warn
    basis:
      document: 《关于进一步推进国有企业贯彻落实"三重一大"决策制度的意见》
      number: 中办发〔2010〕17号（中共中央办公厅、国务院办公厅印发；⚠️ 党内文件，非法律、行政法规或部门规章；全文分三部分，按（一）至（二十三）编号，不设"第X条"）
      clause: （十一）（会议决定的事项、过程……应当完整、详细记录并存档备查）
      excerpt: 会议决定的事项、过程、参与人及其意见、结论等内容，应当完整、详细记录并存档备查。
      kind: derived-from-principle
      source: https://gzw.gd.gov.cn/zcfg/content/post_1334456.html
    params:
        check:
          kind: unique
          field: matterNo
    note: >-
      ✅ **本条已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-soe-triple-major.md）。
      ⚠️ **依据性质说明（2026-10-07）**：本意见是**中共中央办公厅、国务院办公厅印发的党内文件**，
      **不是法律、行政法规或部门规章**，也不属于国家标准体系。
      ⇒ **即使条号与文字已核实，本条仍保持 derived-from-principle（封顶 warn）**：
      **文字已核实，与"该文件能否为 error 级提供依据"是两件事。**
      ⚠️ **（十一）要求完整详细记录**，**未规定议题序号不得重复**。
      序号唯一是"每个议题只被登记一次"的**前提条件**：序号重复会让人无法在会议记录中准确指认议题。
      本次未取得明文条号，故封顶 warn。比较时忽略空白字符。
      注意：同一议题在多次会议中审议是正常的，此时应在会议届次或序号中区分。

